  <style>
    :root { color-scheme: dark; --felt:#123c2f; --gold:#d9ab55; --ink:#f7f0df; --muted:#bdb5a3; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; color:var(--ink); font-family:Inter,ui-sans-serif,system-ui,sans-serif;

    main { width:min(1080px,calc(100% - 2rem)); margin:auto; padding:4rem 0; }
    header { text-align:center; margin-bottom:2.5rem; }
    .eyebrow { color:var(--gold); text-transform:uppercase; letter-spacing:.24em; font-size:.75rem; font-weight:800; }
    h1 { margin:.45rem 0; font-family:Georgia,serif; font-size:clamp(2.4rem,7vw,5rem); font-weight:500; }
    header p { margin:.5rem auto; max-width:40rem; color:var(--muted); }
    #voices { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr)); gap:1.25rem; }
    .voice { padding:1.35rem; border:1px solid #ffffff1f; border-radius:18px; background:#0b100de0;
      box-shadow:0 18px 50px #0007; }
    .voice h2 { margin:0 0 .2rem; font-family:Georgia,serif; font-size:1.55rem; overflow-wrap:anywhere; }
    .count { color:var(--muted); font-size:.82rem; }
    .categories { display:grid; gap:.7rem; margin-top:1.25rem; }
    button { width:100%; display:flex; align-items:center; justify-content:space-between; gap:1rem; padding:.9rem 1rem;
      border:1px solid #d9ab5555; border-radius:10px; color:var(--ink); background:#d9ab5512; font:inherit;
      font-weight:750; cursor:pointer; transition:transform .15s,background .15s,border-color .15s; }
    button:hover { transform:translateY(-2px); background:#d9ab5524; border-color:var(--gold); }
    button:focus-visible { outline:3px solid var(--gold); outline-offset:3px; }
    button.playing { color:#17120a; background:var(--gold); }
    .play { font-size:.78rem; letter-spacing:.08em; text-transform:uppercase; opacity:.8; }
    #status { min-height:1.5em; margin:1.5rem 0 0; text-align:center; color:var(--muted); font-size:.9rem; }
    footer { padding:2rem 0 0; text-align:center; color:#817c71; font-size:.78rem; }
    @media (prefers-reduced-motion:reduce) { * { transition:none!important; } }
  </style>
</head>

    const root = document.querySelector('#voices');
    const player = document.querySelector('#player');
    const status = document.querySelector('#status');
    let activeButton = null;
    const previous = new Map();

    for (const voice of library) {
      const card = document.createElement('article'); card.className = 'voice';
      const total = voice.categories.reduce((sum, category) => sum + category.clips.length, 0);
      const title = document.createElement('h2'); title.textContent = voice.name;
      const count = document.createElement('div'); count.className = 'count';
      count.textContent = `${voice.categories.length} categories · ${total} clips`;
      const categories = document.createElement('div'); categories.className = 'categories';
      for (const category of voice.categories) {
        const button = document.createElement('button'); button.type = 'button';
        const label = document.createElement('span'); label.textContent = category.name;
        const action = document.createElement('span'); action.className = 'play'; action.textContent = 'Play random ▶';
        button.append(label, action);
        button.addEventListener('click', () => playRandom(voice.name, category, button));
        categories.append(button);
      }
      card.append(title, count, categories); root.append(card);
    }

    function playRandom(voice, category, button) {
      const key = `${voice}/${category.name}`;
      let index = Math.floor(Math.random() * category.clips.length);
      if (category.clips.length > 1 && index === previous.get(key)) index = (index + 1) % category.clips.length;
      previous.set(key, index);
      if (activeButton) activeButton.classList.remove('playing');
      activeButton = button; button.classList.add('playing');
      player.src = category.clips[index];
      status.textContent = `Playing ${voice} · ${category.name}`;
      player.play().catch(() => { status.textContent = 'Playback was blocked. Press the button again.'; });
    }
    player.addEventListener('ended', () => {
      if (activeButton) activeButton.classList.remove('playing');
      activeButton = null; status.textContent = 'Select a category to hear another sample.';
    });
    player.addEventListener('error', () => {
      if (activeButton) activeButton.classList.remove('playing');
      status.textContent = 'That audio file could not be played.';
    });
